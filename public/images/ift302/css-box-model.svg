<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <!-- margin -->
  <rect x="30" y="20" width="660" height="400" fill="#fde68a" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="360" y="48" font-size="17" font-weight="bold" text-anchor="middle" fill="#92400e">MARGIN — space outside the border (between boxes)</text>
  <!-- border -->
  <rect x="90" y="70" width="540" height="300" fill="#334155"/>
  <text x="360" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">BORDER</text>
  <!-- padding -->
  <rect x="108" y="102" width="504" height="250" fill="#bbf7d0"/>
  <text x="360" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">PADDING — space inside the border, around the content</text>
  <!-- content -->
  <rect x="190" y="150" width="340" height="150" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="220" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e3a8a">CONTENT</text>
  <text x="360" y="246" font-size="14" text-anchor="middle" fill="#1e3a8a">text, image, etc. — sized by width × height</text>
  <!-- dimension arrows -->
  <g stroke="#1e3a8a" stroke-width="1.5" fill="none">
    <line x1="195" y1="285" x2="525" y2="285"/>
    <line x1="505" y1="160" x2="505" y2="275"/>
  </g>
  <text x="360" y="280" font-size="12" text-anchor="middle" fill="#1e3a8a">width</text>
  <text x="498" y="222" font-size="12" text-anchor="end" fill="#1e3a8a">height</text>
  <text x="360" y="400" font-size="13" text-anchor="middle" fill="#475569">Total space taken = content + padding + border + margin (on each side)</text>
</svg>
