<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="600" fill="#ffffff"/>

  <!-- Panel 1: symmetrical balance -->
  <text x="190" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Symmetrical balance</text>
  <g transform="translate(30,42)">
    <rect width="320" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="28" rx="8" fill="#1e3a8a"/>
    <rect x="0" y="14" width="320" height="14" fill="#1e3a8a"/>
    <rect x="110" y="44" width="100" height="14" rx="3" fill="#334155"/>
    <rect x="70" y="66" width="180" height="7" rx="3" fill="#94a3b8"/>
    <rect x="95" y="79" width="130" height="7" rx="3" fill="#94a3b8"/>
    <rect x="16" y="104" width="88" height="96" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <rect x="116" y="104" width="88" height="96" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <rect x="216" y="104" width="88" height="96" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <line x1="160" y1="32" x2="160" y2="214" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="190" y="284" font-size="12.5" text-anchor="middle" fill="#475569">Mirror image about the centre line — formal, stable</text>

  <!-- Panel 2: asymmetrical balance -->
  <text x="570" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Asymmetrical balance</text>
  <g transform="translate(410,42)">
    <rect width="320" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="16" y="16" width="190" height="188" rx="6" fill="#cbd5e1"/>
    <polyline points="30,190 80,120 120,160 150,130 196,190" fill="none" stroke="#64748b" stroke-width="3"/>
    <circle cx="160" cy="60" r="14" fill="#94a3b8"/>
    <rect x="222" y="24" width="84" height="14" rx="3" fill="#334155"/>
    <rect x="222" y="48" width="80" height="7" rx="3" fill="#94a3b8"/>
    <rect x="222" y="61" width="70" height="7" rx="3" fill="#94a3b8"/>
    <rect x="222" y="74" width="76" height="7" rx="3" fill="#94a3b8"/>
    <rect x="222" y="150" width="84" height="34" rx="17" fill="#f97316"/>
    <text x="264" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Hire me</text>
  </g>
  <text x="570" y="284" font-size="12.5" text-anchor="middle" fill="#475569">Large image balanced by text + a bright button — dynamic</text>

  <!-- Panel 3: cluttered -->
  <text x="190" y="328" font-size="17" font-weight="bold" text-anchor="middle" fill="#b91c1c">✗ Cluttered (no white space)</text>
  <g transform="translate(30,342)">
    <rect width="320" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#fca5a5">
      <rect x="4" y="4" width="312" height="18"/>
    </g>
    <g fill="#fdba74"><rect x="4" y="24" width="60" height="40"/><rect x="66" y="24" width="120" height="12"/><rect x="66" y="38" width="120" height="12"/><rect x="66" y="52" width="120" height="12"/><rect x="188" y="24" width="128" height="40"/></g>
    <g fill="#fde047"><rect x="4" y="66" width="100" height="50"/><rect x="106" y="66" width="100" height="50"/><rect x="208" y="66" width="108" height="50"/></g>
    <g fill="#86efac"><rect x="4" y="118" width="150" height="10"/><rect x="4" y="130" width="150" height="10"/><rect x="4" y="142" width="150" height="10"/><rect x="156" y="118" width="160" height="34"/></g>
    <g fill="#a5b4fc"><rect x="4" y="154" width="76" height="62"/><rect x="82" y="154" width="76" height="62"/><rect x="160" y="154" width="76" height="62"/><rect x="238" y="154" width="78" height="62"/></g>
    <g fill="#ef4444"><rect x="200" y="30" width="44" height="16" rx="3"/><rect x="120" y="86" width="44" height="16" rx="3"/><rect x="250" y="170" width="44" height="16" rx="3"/></g>
  </g>
  <text x="190" y="584" font-size="12.5" text-anchor="middle" fill="#475569">Everything competes — the eye has nowhere to rest</text>

  <!-- Panel 4: white space -->
  <text x="570" y="328" font-size="17" font-weight="bold" text-anchor="middle" fill="#15803d">✓ Generous white space</text>
  <g transform="translate(410,342)">
    <rect width="320" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="24" y="20" width="60" height="10" rx="3" fill="#334155"/>
    <rect x="200" y="20" width="96" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="80" y="64" width="160" height="18" rx="4" fill="#1e3a8a"/>
    <rect x="60" y="94" width="200" height="8" rx="3" fill="#94a3b8"/>
    <rect x="90" y="108" width="140" height="8" rx="3" fill="#94a3b8"/>
    <rect x="115" y="136" width="90" height="30" rx="15" fill="#16a34a"/>
    <text x="160" y="156" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Apply now</text>
  </g>
  <text x="570" y="584" font-size="12.5" text-anchor="middle" fill="#475569">Space groups content and points the eye to one action</text>
</svg>
