<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- window -->
  <rect x="20" y="20" width="620" height="470" rx="6" fill="#1e1e1e" stroke="#94a3b8"/>
  <!-- title/menu bar -->
  <rect x="20" y="20" width="620" height="26" rx="6" fill="#323233"/>
  <text x="34" y="38" font-size="12" fill="#cccccc" xml:space="preserve">File    Edit    Selection    View    Go    Run    Terminal    Help</text>
  <!-- activity bar -->
  <rect x="20" y="46" width="40" height="420" fill="#333333"/>
  <g fill="#c5c5c5">
    <rect x="31" y="60" width="18" height="20" rx="2"/>
    <circle cx="40" cy="104" r="8" fill="none" stroke="#c5c5c5" stroke-width="2.5"/>
    <circle cx="36" cy="138" r="3.5"/><circle cx="46" cy="148" r="3.5"/><circle cx="36" cy="158" r="3.5"/>
    <polygon points="33,180 49,190 33,200"/>
    <rect x="31" y="216" width="8" height="8"/><rect x="41" y="216" width="8" height="8"/><rect x="31" y="226" width="8" height="8"/><rect x="42" y="224" width="8" height="8" transform="rotate(20 46 228)"/>
  </g>
  <!-- side bar / explorer -->
  <rect x="60" y="46" width="160" height="420" fill="#252526"/>
  <text x="72" y="66" font-size="11" fill="#bbbbbb" font-weight="bold">EXPLORER</text>
  <text x="72" y="90" font-size="12" fill="#e5e5e5">▾ WEEK1</text>
  <text x="90" y="112" font-size="12" fill="#e44d26">&lt;/&gt;</text><text x="116" y="112" font-size="12" fill="#e5e5e5">index.html</text>
  <text x="90" y="134" font-size="12" fill="#42a5f5">#</text><text x="116" y="134" font-size="12" fill="#e5e5e5">style.css</text>
  <text x="90" y="156" font-size="12" fill="#f5de19">JS</text><text x="116" y="156" font-size="12" fill="#e5e5e5">script.js</text>
  <text x="90" y="178" font-size="12" fill="#8892bf">php</text><text x="116" y="178" font-size="12" fill="#e5e5e5">hello.php</text>
  <!-- editor -->
  <rect x="220" y="46" width="420" height="26" fill="#252526"/>
  <rect x="220" y="46" width="110" height="26" fill="#1e1e1e"/>
  <text x="232" y="64" font-size="12" fill="#ffffff">index.html  ×</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
    <text x="232" y="96" fill="#858585">1</text><text x="256" y="96" fill="#808080">&lt;!DOCTYPE html&gt;</text>
    <text x="232" y="116" fill="#858585">2</text><text x="256" y="116" fill="#569cd6">&lt;html&gt;</text>
    <text x="232" y="136" fill="#858585">3</text><text x="270" y="136" fill="#569cd6">&lt;head&gt;</text>
    <text x="232" y="156" fill="#858585">4</text><text x="284" y="156"><tspan fill="#569cd6">&lt;title&gt;</tspan><tspan fill="#d4d4d4">My First Web Page</tspan><tspan fill="#569cd6">&lt;/title&gt;</tspan></text>
    <text x="232" y="176" fill="#858585">5</text><text x="270" y="176" fill="#569cd6">&lt;/head&gt;</text>
    <text x="232" y="196" fill="#858585">6</text><text x="270" y="196" fill="#569cd6">&lt;body&gt;</text>
    <text x="232" y="216" fill="#858585">7</text><text x="284" y="216"><tspan fill="#569cd6">&lt;h1&gt;</tspan><tspan fill="#d4d4d4">Welcome</tspan><tspan fill="#569cd6">&lt;/h1&gt;</tspan></text>
    <text x="232" y="236" fill="#858585">8</text><text x="270" y="236" fill="#569cd6">&lt;/body&gt;</text>
    <text x="232" y="256" fill="#858585">9</text><text x="256" y="256" fill="#569cd6">&lt;/html&gt;</text>
  </g>
  <!-- panel / terminal -->
  <rect x="220" y="330" width="420" height="136" fill="#1e1e1e" stroke="#3c3c3c"/>
  <text x="232" y="350" font-size="11" fill="#9d9d9d" font-weight="bold">PROBLEMS</text><text x="302" y="350" font-size="11" fill="#9d9d9d" font-weight="bold">OUTPUT</text><text x="360" y="350" font-size="11" fill="#e7e7e7" font-weight="bold">TERMINAL</text>
  <line x1="360" y1="356" x2="416" y2="356" stroke="#e7e7e7"/>
  <text x="232" y="378" font-size="12" font-family="Consolas, monospace" fill="#cccccc">PS C:\xampp\htdocs\Week1&gt; git status</text>
  <!-- status bar -->
  <rect x="20" y="466" width="620" height="24" fill="#007acc"/>
  <text x="32" y="482" font-size="11" fill="#ffffff" xml:space="preserve">main    ⊗ 0   ⚠ 0</text>
  <text x="500" y="482" font-size="11" fill="#ffffff" xml:space="preserve">Ln 7, Col 18    HTML</text>

  <!-- callouts -->
  <g font-size="14" fill="#0f172a">
    <circle cx="40" cy="70" r="11" fill="#f59e0b"/><text x="40" y="75" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
    <circle cx="140" cy="210" r="11" fill="#f59e0b"/><text x="140" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
    <circle cx="560" cy="110" r="11" fill="#f59e0b"/><text x="560" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
    <circle cx="600" cy="400" r="11" fill="#f59e0b"/><text x="600" y="405" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
    <circle cx="420" cy="478" r="11" fill="#f59e0b"/><text x="420" y="483" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">5</text>
  </g>
  <g font-size="14" fill="#0f172a">
    <circle cx="668" cy="62" r="11" fill="#f59e0b"/><text x="668" y="67" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
    <text x="686" y="58" font-weight="bold">Activity Bar</text>
    <text x="686" y="76" font-size="12.5" fill="#475569">Explorer, Search, Source</text>
    <text x="686" y="92" font-size="12.5" fill="#475569">Control (Git), Run, Extensions</text>

    <circle cx="668" cy="146" r="11" fill="#f59e0b"/><text x="668" y="151" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
    <text x="686" y="142" font-weight="bold">Side Bar (Explorer)</text>
    <text x="686" y="160" font-size="12.5" fill="#475569">Files and folders of the</text>
    <text x="686" y="176" font-size="12.5" fill="#475569">folder you opened</text>

    <circle cx="668" cy="230" r="11" fill="#f59e0b"/><text x="668" y="235" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
    <text x="686" y="226" font-weight="bold">Editor</text>
    <text x="686" y="244" font-size="12.5" fill="#475569">Where you write code; one</text>
    <text x="686" y="260" font-size="12.5" fill="#475569">tab per open file</text>

    <circle cx="668" cy="314" r="11" fill="#f59e0b"/><text x="668" y="319" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
    <text x="686" y="310" font-weight="bold">Panel</text>
    <text x="686" y="328" font-size="12.5" fill="#475569">Integrated terminal, errors</text>
    <text x="686" y="344" font-size="12.5" fill="#475569">(Problems) and output</text>

    <circle cx="668" cy="398" r="11" fill="#f59e0b"/><text x="668" y="403" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">5</text>
    <text x="686" y="394" font-weight="bold">Status Bar</text>
    <text x="686" y="412" font-size="12.5" fill="#475569">Git branch, error count,</text>
    <text x="686" y="428" font-size="12.5" fill="#475569">cursor position, language</text>
  </g>
  <text x="330" y="525" font-size="13" text-anchor="middle" fill="#475569">Simplified layout of Visual Studio Code with a Week1 folder open</text>
</svg>
