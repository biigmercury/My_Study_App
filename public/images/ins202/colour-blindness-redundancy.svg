<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="240" y="40" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Normal colour vision</text>
  <text x="560" y="40" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">Red–green colour blindness</text>
  <text x="560" y="60" font-size="12" text-anchor="middle" fill="#64748b">(deuteranopia, simulated)</text>
  <line x1="400" y1="20" x2="400" y2="400" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="20" y1="215" x2="700" y2="215" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Row A: colour only -->
  <text x="30" y="100" font-size="14" font-weight="bold" fill="#b91c1c">✗ Colour only</text>
  <rect x="150" y="80" width="180" height="40" rx="20" fill="#2E7D32"/>
  <text x="240" y="106" font-size="15" text-anchor="middle" fill="#ffffff">Transfer #1042</text>
  <rect x="150" y="135" width="180" height="40" rx="20" fill="#C62828"/>
  <text x="240" y="161" font-size="15" text-anchor="middle" fill="#ffffff">Transfer #1043</text>

  <rect x="470" y="80" width="180" height="40" rx="20" fill="#6D6D35"/>
  <text x="560" y="106" font-size="15" text-anchor="middle" fill="#ffffff">Transfer #1042</text>
  <rect x="470" y="135" width="180" height="40" rx="20" fill="#767618"/>
  <text x="560" y="161" font-size="15" text-anchor="middle" fill="#ffffff">Transfer #1043</text>
  <text x="560" y="200" font-size="13" text-anchor="middle" fill="#b91c1c">Which one failed? You can’t tell.</text>

  <!-- Row B: colour + icon + text -->
  <text x="30" y="270" font-size="14" font-weight="bold" fill="#15803d">✓ Colour + icon</text>
  <text x="30" y="288" font-size="14" font-weight="bold" fill="#15803d">+ text</text>
  <rect x="150" y="250" width="180" height="40" rx="20" fill="#2E7D32"/>
  <text x="240" y="276" font-size="15" text-anchor="middle" fill="#ffffff">✓ Successful</text>
  <rect x="150" y="305" width="180" height="40" rx="20" fill="#C62828"/>
  <text x="240" y="331" font-size="15" text-anchor="middle" fill="#ffffff">✗ Failed</text>

  <rect x="470" y="250" width="180" height="40" rx="20" fill="#6D6D35"/>
  <text x="560" y="276" font-size="15" text-anchor="middle" fill="#ffffff">✓ Successful</text>
  <rect x="470" y="305" width="180" height="40" rx="20" fill="#767618"/>
  <text x="560" y="331" font-size="15" text-anchor="middle" fill="#ffffff">✗ Failed</text>
  <text x="560" y="370" font-size="13" text-anchor="middle" fill="#15803d">Meaning survives without colour.</text>

  <text x="360" y="405" font-size="11" text-anchor="middle" fill="#94a3b8">Simulated colours computed with the Viénot, Brettel &amp; Mollon (1999) deuteranopia model.</text>
</svg>
