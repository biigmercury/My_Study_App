<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <line x1="360" y1="20" x2="360" y2="420" stroke="#e2e8f0" stroke-width="2"/>

  <!-- POOR -->
  <text x="180" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">✗ Poor error handling</text>
  <rect x="30" y="62" width="300" height="34" rx="4" fill="#fee2e2"/>
  <text x="46" y="84" font-size="14" fill="#b91c1c">Invalid input. Please correct errors.</text>

  <text x="30" y="130" font-size="14" fill="#334155">Name</text>
  <rect x="100" y="112" width="230" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="132" font-size="14" fill="#0f172a">Ada Okafor</text>

  <text x="30" y="178" font-size="14" fill="#334155">DOB</text>
  <rect x="100" y="160" width="230" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="180" font-size="14" fill="#0f172a">2005-14-03</text>

  <text x="30" y="226" font-size="14" fill="#334155">Phone</text>
  <rect x="100" y="208" width="230" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="228" font-size="14" fill="#0f172a">08031234567</text>

  <rect x="100" y="262" width="230" height="38" rx="4" fill="#94a3b8"/>
  <text x="215" y="286" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">Submit</text>

  <g font-size="12.5" fill="#7f1d1d">
    <text x="30" y="336">• Vague message, far from the field</text>
    <text x="30" y="356">• Red border is the ONLY clue (fails colour-blind users)</text>
    <text x="30" y="376">• Side labels, abbreviations ("DOB")</text>
    <text x="30" y="396">• Error found only after pressing Submit</text>
  </g>

  <!-- GOOD -->
  <text x="540" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#15803d">✓ Good error handling</text>

  <text x="390" y="78" font-size="14" fill="#334155">Full name</text>
  <rect x="390" y="86" width="300" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="106" font-size="14" fill="#0f172a">Ada Okafor</text>

  <text x="390" y="142" font-size="14" fill="#334155">Date of birth <tspan fill="#64748b" font-size="12">(DD/MM/YYYY)</tspan></text>
  <rect x="390" y="150" width="300" height="30" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="170" font-size="14" fill="#0f172a">2005-14-03</text>
  <circle cx="400" cy="197" r="8" fill="#dc2626"/>
  <text x="400" y="201.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">!</text>
  <text x="414" y="202" font-size="12.5" fill="#b91c1c">Enter your date of birth as DD/MM/YYYY,</text>
  <text x="414" y="218" font-size="12.5" fill="#b91c1c">for example 14/03/2005.</text>

  <text x="390" y="248" font-size="14" fill="#334155">Phone number <tspan fill="#64748b" font-size="12">(optional)</tspan></text>
  <rect x="390" y="256" width="300" height="30" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="276" font-size="14" fill="#0f172a">0803 123 4567</text>
  <text x="672" y="276" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <rect x="390" y="300" width="300" height="38" rx="4" fill="#0369a1"/>
  <text x="540" y="324" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="bold">Continue</text>

  <g font-size="12.5" fill="#14532d">
    <text x="390" y="362">• Labels above fields; format hint shown upfront</text>
    <text x="390" y="382">• Specific, actionable message right under the field</text>
    <text x="390" y="402">• Colour + icon + text; optional fields marked</text>
    <text x="390" y="422">• Validated in real time, before submitting</text>
  </g>
</svg>
