<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="400" height="680" font-family="Arial, Helvetica, sans-serif">
  <rect width="400" height="680" fill="#ffffff"/>
  <!-- device frame -->
  <rect x="30" y="20" width="340" height="640" rx="28" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <!-- header -->
  <rect x="50" y="50" width="300" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="66" y="78" font-size="18" fill="#475569">←</text>
  <text x="200" y="78" font-size="15" text-anchor="middle" fill="#334155" font-weight="bold">Book Appointment</text>
  <circle cx="330" cy="72" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="77" font-size="13" text-anchor="middle" fill="#64748b">?</text>

  <!-- step indicator -->
  <text x="50" y="122" font-size="12" fill="#64748b">Step 1 of 3</text>
  <rect x="50" y="130" width="300" height="6" fill="#e2e8f0"/>
  <rect x="50" y="130" width="100" height="6" fill="#94a3b8"/>

  <!-- specialty dropdown -->
  <text x="50" y="164" font-size="13" fill="#334155">Specialty</text>
  <rect x="50" y="172" width="300" height="38" fill="#ffffff" stroke="#94a3b8"/>
  <text x="62" y="196" font-size="13" fill="#94a3b8">Select a specialty</text>
  <text x="330" y="196" font-size="13" fill="#64748b">▾</text>

  <!-- date -->
  <text x="50" y="238" font-size="13" fill="#334155">Date</text>
  <g fill="#ffffff" stroke="#cbd5e1">
    <rect x="50" y="246" width="38" height="34"/><rect x="94" y="246" width="38" height="34"/><rect x="138" y="246" width="38" height="34"/><rect x="182" y="246" width="38" height="34"/><rect x="226" y="246" width="38" height="34"/><rect x="270" y="246" width="38" height="34"/><rect x="314" y="246" width="36" height="34"/>
    <rect x="50" y="286" width="38" height="34"/><rect x="94" y="286" width="38" height="34"/><rect x="138" y="286" width="38" height="34" fill="#cbd5e1"/><rect x="182" y="286" width="38" height="34"/><rect x="226" y="286" width="38" height="34"/><rect x="270" y="286" width="38" height="34"/><rect x="314" y="286" width="36" height="34"/>
  </g>

  <!-- time slots -->
  <text x="50" y="348" font-size="13" fill="#334155">Available times</text>
  <g fill="#ffffff" stroke="#94a3b8">
    <rect x="50" y="356" width="90" height="32" rx="16"/><rect x="150" y="356" width="90" height="32" rx="16"/><rect x="250" y="356" width="90" height="32" rx="16"/>
    <rect x="50" y="396" width="90" height="32" rx="16"/><rect x="150" y="396" width="90" height="32" rx="16"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#64748b">
    <text x="95" y="377">09:00</text><text x="195" y="377">10:30</text><text x="295" y="377">12:00</text>
    <text x="95" y="417">14:00</text><text x="195" y="417">15:30</text>
  </g>

  <!-- reason -->
  <text x="50" y="456" font-size="13" fill="#334155">Reason for visit (optional)</text>
  <rect x="50" y="464" width="300" height="70" fill="#ffffff" stroke="#94a3b8"/>
  <g stroke="#e2e8f0" stroke-width="2"><line x1="62" y1="484" x2="330" y2="484"/><line x1="62" y1="500" x2="300" y2="500"/><line x1="62" y1="516" x2="250" y2="516"/></g>

  <!-- continue -->
  <rect x="50" y="580" width="300" height="48" rx="6" fill="#94a3b8"/>
  <text x="200" y="610" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Continue</text>
</svg>
