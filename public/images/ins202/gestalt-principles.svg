<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="620" fill="#ffffff"/>
  <line x1="360" y1="20" x2="360" y2="600" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="20" y1="310" x2="700" y2="310" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 1. Proximity: two clusters -->
  <text x="180" y="44" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Proximity</text>
  <g fill="#0369a1">
    <circle cx="70" cy="110" r="14"/><circle cx="110" cy="110" r="14"/><circle cx="150" cy="110" r="14"/>
    <circle cx="70" cy="150" r="14"/><circle cx="110" cy="150" r="14"/><circle cx="150" cy="150" r="14"/>
    <circle cx="70" cy="190" r="14"/><circle cx="110" cy="190" r="14"/><circle cx="150" cy="190" r="14"/>
    <circle cx="230" cy="110" r="14"/><circle cx="270" cy="110" r="14"/><circle cx="310" cy="110" r="14"/>
    <circle cx="230" cy="150" r="14"/><circle cx="270" cy="150" r="14"/><circle cx="310" cy="150" r="14"/>
    <circle cx="230" cy="190" r="14"/><circle cx="270" cy="190" r="14"/><circle cx="310" cy="190" r="14"/>
  </g>
  <text x="180" y="250" font-size="15" text-anchor="middle" fill="#334155">Identical dots — but we see</text>
  <text x="180" y="272" font-size="15" text-anchor="middle" fill="#334155"><tspan font-weight="bold">two groups</tspan> because of the gap.</text>

  <!-- 2. Similarity: alternating columns -->
  <text x="540" y="44" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Similarity</text>
  <g>
    <circle cx="440" cy="100" r="14" fill="#0369a1"/><circle cx="490" cy="100" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="540" cy="100" r="14" fill="#0369a1"/><circle cx="590" cy="100" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="640" cy="100" r="14" fill="#0369a1"/>
    <circle cx="440" cy="145" r="14" fill="#0369a1"/><circle cx="490" cy="145" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="540" cy="145" r="14" fill="#0369a1"/><circle cx="590" cy="145" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="640" cy="145" r="14" fill="#0369a1"/>
    <circle cx="440" cy="190" r="14" fill="#0369a1"/><circle cx="490" cy="190" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="540" cy="190" r="14" fill="#0369a1"/><circle cx="590" cy="190" r="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="640" cy="190" r="14" fill="#0369a1"/>
  </g>
  <text x="540" y="250" font-size="15" text-anchor="middle" fill="#334155">Evenly spaced — but we see</text>
  <text x="540" y="272" font-size="15" text-anchor="middle" fill="#334155"><tspan font-weight="bold">columns</tspan> of alike items.</text>

  <!-- 3. Closure: broken circle and broken square -->
  <text x="180" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Closure</text>
  <g fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round">
    <path d="M 70 430 A 55 55 0 0 1 120 376"/>
    <path d="M 140 377 A 55 55 0 0 1 177 440"/>
    <path d="M 170 462 A 55 55 0 0 1 108 484"/>
    <path d="M 88 478 A 55 55 0 0 1 67 450"/>
    <path d="M 220 390 L 220 375 L 250 375"/>
    <path d="M 280 375 L 310 375 L 310 405"/>
    <path d="M 310 440 L 310 470 L 280 470"/>
    <path d="M 250 470 L 220 470 L 220 435"/>
  </g>
  <text x="180" y="540" font-size="15" text-anchor="middle" fill="#334155">Broken lines — but the mind</text>
  <text x="180" y="562" font-size="15" text-anchor="middle" fill="#334155"><tspan font-weight="bold">closes the gaps</tspan>: a circle and a square.</text>

  <!-- 4. Continuity: two smooth crossing curves -->
  <text x="540" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Continuity</text>
  <path d="M 400 480 C 470 480, 520 380, 680 380" fill="none" stroke="#0369a1" stroke-width="7" stroke-linecap="round"/>
  <path d="M 400 385 C 480 385, 560 485, 680 480" fill="none" stroke="#0369a1" stroke-width="7" stroke-linecap="round"/>
  <text x="540" y="540" font-size="15" text-anchor="middle" fill="#334155">We see <tspan font-weight="bold">two smooth lines crossing</tspan>,</text>
  <text x="540" y="562" font-size="15" text-anchor="middle" fill="#334155">not four pieces meeting at a point.</text>
</svg>
