<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="560" fill="#ffffff"/>
  <defs>
    <clipPath id="scrR"><rect x="410" y="60" width="200" height="380" rx="14"/></clipPath>
    <clipPath id="scrL"><rect x="110" y="60" width="200" height="380" rx="14"/></clipPath>
  </defs>

  <!-- LEFT HAND phone: thumb pivots at bottom-left -->
  <rect x="98" y="40" width="224" height="440" rx="30" fill="#1e293b"/>
  <g clip-path="url(#scrL)">
    <rect x="110" y="60" width="200" height="380" fill="#fecaca"/>
    <circle cx="100" cy="470" r="300" fill="#fde68a"/>
    <circle cx="100" cy="470" r="200" fill="#bbf7d0"/>
    <rect x="110" y="404" width="200" height="36" fill="#0369a1" opacity="0.85"/>
    <text x="210" y="427" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">Bottom navigation</text>
  </g>
  <text x="210" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Left hand</text>

  <!-- RIGHT HAND phone: thumb pivots at bottom-right -->
  <rect x="398" y="40" width="224" height="440" rx="30" fill="#1e293b"/>
  <g clip-path="url(#scrR)">
    <rect x="410" y="60" width="200" height="380" fill="#fecaca"/>
    <circle cx="620" cy="470" r="300" fill="#fde68a"/>
    <circle cx="620" cy="470" r="200" fill="#bbf7d0"/>
    <rect x="410" y="404" width="200" height="36" fill="#0369a1" opacity="0.85"/>
    <text x="510" y="427" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">Bottom navigation</text>
  </g>
  <text x="510" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Right hand</text>

  <!-- zone labels inside phones -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="250" y="100" fill="#991b1b">HARD</text>
    <text x="235" y="215" fill="#92400e">STRETCH</text>
    <text x="160" y="345" fill="#166534">NATURAL</text>
    <text x="470" y="100" fill="#991b1b">HARD</text>
    <text x="485" y="215" fill="#92400e">STRETCH</text>
    <text x="560" y="345" fill="#166534">NATURAL</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#0f172a">
    <rect x="80" y="500" width="16" height="16" fill="#bbf7d0" stroke="#166534"/>
    <text x="102" y="513">Natural — easy one-handed reach</text>
    <rect x="330" y="500" width="16" height="16" fill="#fde68a" stroke="#92400e"/>
    <text x="352" y="513">Stretch — thumb extends</text>
    <rect x="520" y="500" width="16" height="16" fill="#fecaca" stroke="#991b1b"/>
    <text x="542" y="513">Hard — grip shift</text>
  </g>
  <text x="360" y="545" font-size="12" text-anchor="middle" fill="#64748b">Zones are approximate; after Hoober (2013). Put primary actions in the natural zone.</text>
</svg>
