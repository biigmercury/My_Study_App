<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>

  <!-- Panel 1: primitive array -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">1. Primitive array: int[] arr = {10, 20, 30, 40};</text>
  <rect x="20" y="52" width="70" height="40" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="55" y="77" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#0f172a">arr</text>
  <line x1="90" y1="72" x2="150" y2="72" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <g font-family="Consolas, monospace" font-size="17" text-anchor="middle">
    <rect x="155" y="52" width="80" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="195" y="78" fill="#1e3a8a">10</text>
    <rect x="235" y="52" width="80" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="275" y="78" fill="#1e3a8a">20</text>
    <rect x="315" y="52" width="80" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="355" y="78" fill="#1e3a8a">30</text>
    <rect x="395" y="52" width="80" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="435" y="78" fill="#1e3a8a">40</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#475569">
    <text x="195" y="110">index 0</text><text x="275" y="110">index 1</text><text x="355" y="110">index 2</text><text x="435" y="110">index 3</text>
  </g>
  <text x="495" y="70" font-size="13" fill="#475569">The values themselves sit</text>
  <text x="495" y="87" font-size="13" fill="#475569">side by side (contiguous);</text>
  <text x="495" y="104" font-size="13" fill="#475569">arr.length is 4</text>

  <!-- Panel 2: reference array -->
  <text x="20" y="160" font-size="16" font-weight="bold" fill="#0f172a">2. Non-primitive array: String[] names = {"Ada", "Musa", "Chioma"};</text>
  <rect x="20" y="182" width="70" height="40" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="55" y="207" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#0f172a">names</text>
  <line x1="90" y1="202" x2="150" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="155" y="182" width="80" height="40" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <rect x="235" y="182" width="80" height="40" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <rect x="315" y="182" width="80" height="40" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <circle cx="195" cy="202" r="5" fill="#b45309"/><circle cx="275" cy="202" r="5" fill="#b45309"/><circle cx="355" cy="202" r="5" fill="#b45309"/>
  </g>
  <g font-size="11" fill="#78350f"><text x="160" y="195">[0]</text><text x="240" y="195">[1]</text><text x="320" y="195">[2]</text></g>
  <g stroke="#b45309" stroke-width="2" fill="none">
    <path d="M195 207 C 195 260, 160 270, 160 292" marker-end="url(#ar)"/>
    <path d="M275 207 C 275 260, 300 270, 300 292" marker-end="url(#ar)"/>
    <path d="M355 207 C 355 250, 440 270, 440 292" marker-end="url(#ar)"/>
  </g>
  <g font-family="Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="110" y="295" width="100" height="36" rx="18" fill="#fef3c7" stroke="#b45309"/><text x="160" y="318" fill="#78350f">"Ada"</text>
    <rect x="250" y="295" width="100" height="36" rx="18" fill="#fef3c7" stroke="#b45309"/><text x="300" y="318" fill="#78350f">"Musa"</text>
    <rect x="390" y="295" width="100" height="36" rx="18" fill="#fef3c7" stroke="#b45309"/><text x="440" y="318" fill="#78350f">"Chioma"</text>
  </g>
  <text x="515" y="198" font-size="13" fill="#475569">The slots hold references</text>
  <text x="515" y="215" font-size="13" fill="#475569">(addresses) to String</text>
  <text x="515" y="232" font-size="13" fill="#475569">objects stored elsewhere</text>
  <text x="515" y="249" font-size="13" fill="#475569">on the heap</text>

  <!-- Panel 3: 2D array -->
  <text x="20" y="385" font-size="16" font-weight="bold" fill="#0f172a">3. 2D array = array of arrays: int[][] m = {{1, 2, 3}, {4, 5, 6}};</text>
  <rect x="20" y="420" width="70" height="40" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="55" y="445" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#0f172a">m</text>
  <line x1="90" y1="440" x2="150" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="155" y="410" width="70" height="40" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="155" y="450" width="70" height="40" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="190" cy="430" r="5" fill="#6d28d9"/><circle cx="190" cy="470" r="5" fill="#6d28d9"/>
  <g font-size="11" fill="#4c1d95"><text x="159" y="423">[0]</text><text x="159" y="463">[1]</text></g>
  <g stroke="#6d28d9" stroke-width="2" fill="none">
    <line x1="195" y1="430" x2="290" y2="430" marker-end="url(#ar)"/>
    <path d="M195 470 C 240 470, 250 530, 290 530" marker-end="url(#ar)"/>
  </g>
  <g font-family="Consolas, monospace" font-size="16" text-anchor="middle">
    <rect x="295" y="410" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="325" y="436" fill="#1e3a8a">1</text>
    <rect x="355" y="410" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="385" y="436" fill="#1e3a8a">2</text>
    <rect x="415" y="410" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="445" y="436" fill="#1e3a8a">3</text>
    <rect x="295" y="510" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="325" y="536" fill="#1e3a8a">4</text>
    <rect x="355" y="510" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="385" y="536" fill="#1e3a8a">5</text>
    <rect x="415" y="510" width="60" height="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="445" y="536" fill="#1e3a8a">6</text>
  </g>
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="190" y="405">rows</text>
    <text x="325" y="468">[0][0]</text><text x="385" y="468">[0][1]</text><text x="445" y="468">[0][2]</text>
    <text x="325" y="568">[1][0]</text><text x="385" y="568">[1][1]</text><text x="445" y="568">[1][2]</text>
  </g>
  <text x="500" y="425" font-size="13" fill="#475569">m.length = 2 (rows)</text>
  <text x="500" y="445" font-size="13" fill="#475569">m[0].length = 3 (columns)</text>
  <text x="500" y="465" font-size="13" fill="#475569">m[1][2] is 6:</text>
  <text x="500" y="482" font-size="13" fill="#475569">row 1, column 2</text>
  <text x="380" y="605" font-size="13" text-anchor="middle" fill="#64748b">Each row is itself an array, so rows can even have different lengths ("jagged" arrays).</text>
</svg>
