<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 556" width="620" height="556" font-family="Arial, Helvetica, sans-serif">
  <rect width="620" height="556" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">Inside the Earth (radius ≈ 6,371 km)</text>
  <g transform="translate(0,36)">
  <!-- half-Earth cross-section, centre at (310,300), 1 px = 22.75 km (crust exaggerated) -->
  <path d="M30,300 A280,280 0 0,1 590,300 Z" fill="#6b8e4e"/>
  <path d="M42,300 A268,268 0 0,1 578,300 Z" fill="#e0833c"/>
  <path d="M157,300 A153,153 0 0,1 463,300 Z" fill="#f2c14e"/>
  <path d="M256,300 A54,54 0 0,1 364,300 Z" fill="#fbe7a1"/>
  <line x1="30" y1="300" x2="590" y2="300" stroke="#1f2a44" stroke-width="2"/>
  <g font-weight="700" text-anchor="middle" fill="#1f2a44">
    <text x="310" y="104" font-size="20">Mantle</text>
    <text x="310" y="200" font-size="19">Outer core (liquid)</text>
    <text x="310" y="288" font-size="15">Inner core</text>
  </g>
  <!-- crust callout -->
  <line x1="120" y1="115" x2="70" y2="75" stroke="#1f2a44" stroke-width="2"/>
  <text x="66" y="68" font-size="17" font-weight="700" fill="#1f2a44" text-anchor="start">Crust</text>
  <!-- legend below -->
  <g font-size="16" fill="#1f2a44">
    <rect x="40" y="330" width="18" height="18" fill="#6b8e4e"/>
    <text x="68" y="345"><tspan font-weight="700">Crust</tspan> — 0 to ~35 km (oceanic 5–10 km, continental 20–70 km)</text>
    <rect x="40" y="364" width="18" height="18" fill="#e0833c"/>
    <text x="68" y="379"><tspan font-weight="700">Mantle</tspan> — ~35 to ~2,890 km deep</text>
    <rect x="40" y="398" width="18" height="18" fill="#f2c14e"/>
    <text x="68" y="413"><tspan font-weight="700">Outer core</tspan> — 2,890 to 5,150 km deep</text>
    <rect x="40" y="432" width="18" height="18" fill="#fbe7a1" stroke="#c9a94b"/>
    <text x="68" y="447"><tspan font-weight="700">Inner core</tspan> — 5,150 km to the centre</text>
    <text x="40" y="484" font-size="15">Lithosphere = crust + rigid top of the mantle (~100 km),</text>
    <text x="40" y="504" font-size="15">floating on the soft, plastic asthenosphere below it.</text>
  </g>
  </g>
</svg>
