<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#334155" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- system boundary -->
  <rect x="170" y="20" width="440" height="480" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="390" y="46" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">University Course Registration System</text>

  <!-- use cases -->
  <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
    <ellipse cx="320" cy="100" rx="82" ry="26"/>
    <ellipse cx="320" cy="190" rx="82" ry="26"/>
    <ellipse cx="320" cy="280" rx="82" ry="26"/>
    <ellipse cx="320" cy="370" rx="82" ry="26"/>
    <ellipse cx="320" cy="455" rx="82" ry="26"/>
    <ellipse cx="520" cy="130" rx="76" ry="26"/>
    <ellipse cx="520" cy="265" rx="76" ry="26"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0f172a">
    <text x="320" y="105">Login</text>
    <text x="320" y="195">Register Course</text>
    <text x="320" y="285">View Result</text>
    <text x="320" y="375">Upload Result</text>
    <text x="320" y="460">Manage Courses</text>
    <text x="520" y="126">Check</text>
    <text x="520" y="142">Prerequisites</text>
    <text x="520" y="261">Pay Late</text>
    <text x="520" y="277">Registration Fee</text>
  </g>

  <!-- include / extend (dashed, open arrowheads) -->
  <line x1="398" y1="178" x2="452" y2="148" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="418" y="153" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(-29 418 153)">«include»</text>
  <line x1="462" y1="248" x2="394" y2="206" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="412" y="245" font-size="12" fill="#334155" text-anchor="middle" transform="rotate(32 412 245)">«extend»</text>

  <!-- actor helper: head, body, arms, legs -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <!-- Student -->
    <circle cx="80" cy="150" r="13"/><line x1="80" y1="163" x2="80" y2="200"/><line x1="58" y1="176" x2="102" y2="176"/><line x1="80" y1="200" x2="62" y2="230"/><line x1="80" y1="200" x2="98" y2="230"/>
    <!-- Lecturer -->
    <circle cx="80" cy="340" r="13"/><line x1="80" y1="353" x2="80" y2="390"/><line x1="58" y1="366" x2="102" y2="366"/><line x1="80" y1="390" x2="62" y2="420"/><line x1="80" y1="390" x2="98" y2="420"/>
    <!-- Administrator -->
    <circle cx="690" cy="410" r="13"/><line x1="690" y1="423" x2="690" y2="460"/><line x1="668" y1="436" x2="712" y2="436"/><line x1="690" y1="460" x2="672" y2="490"/><line x1="690" y1="460" x2="708" y2="490"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <text x="80" y="250">Student</text>
    <text x="80" y="440">Lecturer</text>
    <text x="690" y="512">Administrator</text>
  </g>

  <!-- associations (solid) -->
  <g stroke="#0f172a" stroke-width="1.6">
    <line x1="104" y1="170" x2="240" y2="108"/>
    <line x1="104" y1="176" x2="238" y2="190"/>
    <line x1="104" y1="184" x2="242" y2="272"/>
    <line x1="104" y1="356" x2="244" y2="112"/>
    <line x1="104" y1="366" x2="238" y2="370"/>
    <line x1="666" y1="434" x2="402" y2="455"/>
  </g>
</svg>
