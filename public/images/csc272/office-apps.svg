<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="640" height="250" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">The four Office 2013 applications in CSC 272</text>
  <g transform="translate(34,50)">
    <rect width="118" height="118" rx="6" fill="#2B579A"/>
    <text x="59" y="84" text-anchor="middle" font-size="72" font-weight="700" fill="#ffffff">W</text>
    <text x="59" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Word</text>
    <text x="59" y="166" text-anchor="middle" font-size="12.5" fill="#4b5563">word processor</text>
    <text x="59" y="184" text-anchor="middle" font-size="12.5" fill="#4b5563">document · .docx</text>
  </g>
  <g transform="translate(184,50)">
    <rect width="118" height="118" rx="6" fill="#217346"/>
    <text x="59" y="84" text-anchor="middle" font-size="72" font-weight="700" fill="#ffffff">X</text>
    <text x="59" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Excel</text>
    <text x="59" y="166" text-anchor="middle" font-size="12.5" fill="#4b5563">spreadsheet</text>
    <text x="59" y="184" text-anchor="middle" font-size="12.5" fill="#4b5563">workbook · .xlsx</text>
  </g>
  <g transform="translate(334,50)">
    <rect width="118" height="118" rx="6" fill="#B7472A"/>
    <text x="59" y="84" text-anchor="middle" font-size="72" font-weight="700" fill="#ffffff">P</text>
    <text x="59" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">PowerPoint</text>
    <text x="59" y="166" text-anchor="middle" font-size="12.5" fill="#4b5563">presentation</text>
    <text x="59" y="184" text-anchor="middle" font-size="12.5" fill="#4b5563">presentation · .pptx</text>
  </g>
  <g transform="translate(484,50)">
    <rect width="118" height="118" rx="6" fill="#A4373A"/>
    <text x="59" y="84" text-anchor="middle" font-size="72" font-weight="700" fill="#ffffff">A</text>
    <text x="59" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Access</text>
    <text x="59" y="166" text-anchor="middle" font-size="12.5" fill="#4b5563">database manager</text>
    <text x="59" y="184" text-anchor="middle" font-size="12.5" fill="#4b5563">database · .accdb</text>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="11.5" fill="#6b7280">Office 2013 icons are flat coloured tiles with a white initial (drawn here as simplified tiles, not the official logos).</text>
</svg>
