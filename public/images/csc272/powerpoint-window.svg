  <g font-size="14" fill="#111">
    <text x="10" y="470"><tspan font-weight="700" fill="#1d4ed8">1</tspan>  Quick Access Toolbar</text>
    <text x="10" y="494"><tspan font-weight="700" fill="#1d4ed8">2</tspan>  Title bar (file name)</text>
    <text x="10" y="518"><tspan font-weight="700" fill="#1d4ed8">3</tspan>  FILE tab → Backstage view</text>
    <text x="10" y="542"><tspan font-weight="700" fill="#1d4ed8">4</tspan>  Ribbon tabs (groups below)</text>
    <text x="10" y="566"><tspan font-weight="700" fill="#1d4ed8">5</tspan>  Slides pane (thumbnails)</text>
    <text x="10" y="590"><tspan font-weight="700" fill="#1d4ed8">6</tspan>  Title placeholder</text>
    <text x="320" y="470"><tspan font-weight="700" fill="#1d4ed8">7</tspan>  Subtitle placeholder</text>
    <text x="320" y="494"><tspan font-weight="700" fill="#1d4ed8">8</tspan>  Notes pane</text>
    <text x="320" y="518"><tspan font-weight="700" fill="#1d4ed8">9</tspan>  Status bar</text>
    <text x="320" y="542"><tspan font-weight="700" fill="#1d4ed8">10</tspan>  View buttons: Normal, Slide</text>
    <text x="346" y="566">Sorter, Reading View, Slide Show</text>
    <text x="320" y="590"><tspan font-weight="700" fill="#1d4ed8">11</tspan>  Zoom slider</text>
