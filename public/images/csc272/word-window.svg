<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="620" height="640" fill="#ffffff"/>
  <rect x="10" y="10" width="600" height="440" fill="#f3f3f3" stroke="#9ca3af"/>
  <!-- title bar -->
  <rect x="10" y="10" width="600" height="26" fill="#2B579A"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.3">
    <rect x="20" y="17" width="10" height="11"/>
    <path d="M40 27 q4 -9 12 -4"/>
    <path d="M68 27 q-4 -9 -12 -4"/>
  </g>
  <text x="310" y="28" font-size="11.5" fill="#fff" text-anchor="middle">Document1 - Word</text>
  <text x="598" y="28" font-size="11" fill="#fff" text-anchor="end">?   –    ☐    ✕</text>
  <!-- tabs -->
  <rect x="10" y="36" width="600" height="20" fill="#ffffff"/>
  <rect x="10" y="36" width="36" height="20" fill="#2B579A"/>
  <g font-size="9.5">
    <text x="28" y="50" fill="#fff" text-anchor="middle" font-weight="700">FILE</text>
    <text x="54" y="50" fill="#2B579A" font-weight="700">HOME</text>
    <text x="92" y="50" fill="#444">INSERT</text>
    <text x="134" y="50" fill="#444">DESIGN</text>
    <text x="178" y="50" fill="#444">PAGE LAYOUT</text>
    <text x="250" y="50" fill="#444">REFERENCES</text>
    <text x="318" y="50" fill="#444">MAILINGS</text>
    <text x="372" y="50" fill="#444">REVIEW</text>
    <text x="418" y="50" fill="#444">VIEW</text>
  </g>
  <text x="598" y="50" font-size="9.5" fill="#444" text-anchor="end">Sign in</text>
  <!-- ribbon -->
  <rect x="10" y="56" width="600" height="56" fill="#f7f7f7" stroke="#d4d4d4"/>
  <g font-size="8.5" fill="#666" text-anchor="middle">
    <text x="45" y="106">Clipboard</text><text x="175" y="106">Font</text><text x="330" y="106">Paragraph</text><text x="470" y="106">Styles</text><text x="570" y="106">Editing</text>
  </g>
  <g stroke="#dcdcdc"><line x1="80" y1="60" x2="80" y2="108"/><line x1="265" y1="60" x2="265" y2="108"/><line x1="400" y1="60" x2="400" y2="108"/><line x1="535" y1="60" x2="535" y2="108"/></g>
  <rect x="92" y="62" width="100" height="14" fill="#fff" stroke="#c6c6c6"/><text x="96" y="73" font-size="9" fill="#333">Calibri (Body)</text>
  <rect x="196" y="62" width="26" height="14" fill="#fff" stroke="#c6c6c6"/><text x="200" y="73" font-size="9" fill="#333">11</text>
  <text x="95" y="93" font-size="11" fill="#333" font-weight="700">B</text><text x="110" y="93" font-size="11" fill="#333" font-style="italic">I</text><text x="122" y="93" font-size="11" fill="#333" text-decoration="underline">U</text>
  <g fill="#666"><rect x="410" y="64" width="36" height="28" fill="#fff" stroke="#d1d5db"/><rect x="450" y="64" width="36" height="28" fill="#fff" stroke="#d1d5db"/><rect x="490" y="64" width="36" height="28" fill="#fff" stroke="#d1d5db"/></g>
  <text x="428" y="82" font-size="8" text-anchor="middle" fill="#333">Normal</text><text x="468" y="82" font-size="8" text-anchor="middle" fill="#333">No Spac…</text><text x="508" y="82" font-size="8" text-anchor="middle" fill="#2B579A">Heading 1</text>
  <path d="M254 100 l7 0 l0 -7" fill="none" stroke="#666" stroke-width="1.2"/>
  <path d="M388 100 l7 0 l0 -7" fill="none" stroke="#666" stroke-width="1.2"/>
  <!-- ruler -->
  <rect x="10" y="112" width="600" height="16" fill="#eeeeee"/>
  <rect x="150" y="116" width="320" height="8" fill="#ffffff" stroke="#cfcfcf"/>
  <g font-size="6.5" fill="#666"><text x="168" y="123">1</text><text x="188" y="123">2</text><text x="208" y="123">3</text><text x="228" y="123">4</text><text x="248" y="123">5</text><text x="268" y="123">6</text><text x="288" y="123">7</text></g>
  <path d="M146 113 l8 0 l-4 5 z" fill="#555"/><path d="M146 127 l8 0 l-4 -5 z" fill="#555"/>
  <!-- page area -->
  <rect x="10" y="128" width="588" height="286" fill="#dfdfdf"/>
  <rect x="120" y="136" width="380" height="278" fill="#ffffff" stroke="#c7c7c7"/>
  <text x="150" y="170" font-size="12" fill="#222">I made myself a mud house, as perfect as could be.</text>
  <text x="150" y="188" font-size="12" fill="#222">I was pleased with myself.</text>
  <line x1="298" y1="176" x2="298" y2="192" stroke="#111" stroke-width="1.3"/>
  <!-- scroll bar -->
  <rect x="598" y="128" width="12" height="286" fill="#f0f0f0" stroke="#d4d4d4"/>
  <rect x="600" y="140" width="8" height="60" rx="3" fill="#c1c1c1"/>
  <!-- status bar -->
  <rect x="10" y="414" width="600" height="36" fill="#2B579A"/>
  <g font-size="9.5" fill="#fff"><text x="20" y="436">PAGE 1 OF 1</text><text x="96" y="436">19 WORDS</text><text x="160" y="436">ENGLISH (UNITED KINGDOM)</text></g>
  <g fill="none" stroke="#ffffff"><rect x="420" y="425" width="13" height="13"/><rect x="440" y="425" width="13" height="13" fill="#ffffff33"/><rect x="460" y="425" width="13" height="13"/></g>
  <line x1="484" y1="432" x2="566" y2="432" stroke="#ffffff"/><circle cx="525" cy="432" r="4" fill="#ffffff"/>
  <text x="604" y="436" font-size="9" fill="#fff" text-anchor="end">100%</text>
  <!-- badges -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="86" cy="23" r="9" fill="#d97706"/><text x="86" y="27">1</text>
    <circle cx="232" cy="23" r="9" fill="#d97706"/><text x="232" y="27">2</text>
    <circle cx="515" cy="23" r="9" fill="#d97706"/><text x="515" y="27">3</text>
    <circle cx="28" cy="66" r="9" fill="#d97706"/><text x="28" y="70">4</text>
    <circle cx="460" cy="46" r="9" fill="#d97706"/><text x="460" y="50">5</text>
    <circle cx="560" cy="80" r="9" fill="#d97706"/><text x="560" y="84">6</text>
    <circle cx="240" cy="94" r="9" fill="#d97706"/><text x="240" y="98">7</text>
    <circle cx="490" cy="120" r="9" fill="#d97706"/><text x="490" y="124">8</text>
    <circle cx="320" cy="210" r="9" fill="#d97706"/><text x="320" y="214">9</text>
    <circle cx="585" cy="250" r="9" fill="#d97706"/><text x="585" y="254">10</text>
    <circle cx="330" cy="432" r="9" fill="#d97706"/><text x="330" y="436">11</text>
    <circle cx="446" cy="404" r="9" fill="#d97706"/><text x="446" y="408">12</text>
    <circle cx="540" cy="404" r="9" fill="#d97706"/><text x="540" y="408">13</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#111">
    <text x="10" y="482"><tspan font-weight="700" fill="#d97706">1</tspan>  Quick Access Toolbar</text>
    <text x="10" y="506"><tspan font-weight="700" fill="#d97706">2</tspan>  Title bar (Document1 - Word)</text>
    <text x="10" y="530"><tspan font-weight="700" fill="#d97706">3</tspan>  Help, Minimize, Maximize, Close</text>
    <text x="10" y="554"><tspan font-weight="700" fill="#d97706">4</tspan>  FILE tab → Backstage view</text>
    <text x="10" y="578"><tspan font-weight="700" fill="#d97706">5</tspan>  Ribbon tabs</text>
    <text x="10" y="602"><tspan font-weight="700" fill="#d97706">6</tspan>  Ribbon groups and commands</text>
    <text x="10" y="626"><tspan font-weight="700" fill="#d97706">7</tspan>  Dialog Box Launcher</text>
    <text x="320" y="482"><tspan font-weight="700" fill="#d97706">8</tspan>  Ruler (indent markers)</text>
    <text x="320" y="506"><tspan font-weight="700" fill="#d97706">9</tspan>  Document area, insertion point</text>
    <text x="320" y="530"><tspan font-weight="700" fill="#d97706">10</tspan>  Scroll bar</text>
    <text x="320" y="554"><tspan font-weight="700" fill="#d97706">11</tspan>  Status bar: page, words, language</text>
    <text x="320" y="578"><tspan font-weight="700" fill="#d97706">12</tspan>  Views: Read Mode, Print</text>
    <text x="346" y="602">Layout, Web Layout</text>
    <text x="320" y="626"><tspan font-weight="700" fill="#d97706">13</tspan>  Zoom slider</text>
  </g>
</svg>
