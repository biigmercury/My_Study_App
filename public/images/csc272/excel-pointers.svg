<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="620" height="250" fill="#ffffff"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <!-- 1 white cross: select -->
    <g transform="translate(105,70)">
      <rect x="-60" y="-40" width="120" height="80" fill="#f9fafb" stroke="#e5e7eb"/>
      <path d="M-6 -24 h12 v18 h18 v12 h-18 v18 h-12 v-18 h-18 v-12 h18 z" fill="#ffffff" stroke="#111" stroke-width="2"/>
      <text x="0" y="68" font-weight="700">White cross</text>
      <text x="0" y="88" font-size="13" fill="#374151">centre of a cell</text>
      <text x="0" y="106" font-size="13" fill="#374151">→ select cells</text>
    </g>
    <!-- 2 four-headed arrow: move -->
    <g transform="translate(310,70)">
      <rect x="-60" y="-40" width="120" height="80" fill="#f9fafb" stroke="#e5e7eb"/>
      <rect x="-40" y="-14" width="80" height="28" fill="#fff" stroke="#217346" stroke-width="2.5"/>
      <g stroke="#111" stroke-width="2" fill="#111" transform="translate(40,-14)">
        <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-14" y1="0" x2="14" y2="0"/>
        <path d="M0 -18 l-4 6 h8 z"/><path d="M0 18 l-4 -6 h8 z"/><path d="M-18 0 l6 -4 v8 z"/><path d="M18 0 l-6 -4 v8 z"/>
      </g>
      <text x="0" y="68" font-weight="700">Four-headed arrow</text>
      <text x="0" y="88" font-size="13" fill="#374151">on the cell border</text>
      <text x="0" y="106" font-size="13" fill="#374151">→ drag to move</text>
    </g>
    <!-- 3 black plus: fill handle -->
    <g transform="translate(515,70)">
      <rect x="-60" y="-40" width="120" height="80" fill="#f9fafb" stroke="#e5e7eb"/>
      <rect x="-40" y="-14" width="80" height="28" fill="#fff" stroke="#217346" stroke-width="2.5"/>
      <rect x="36" y="10" width="7" height="7" fill="#217346" stroke="#fff"/>
      <path d="M40 0 v28 M26 14 h28" stroke="#111" stroke-width="3"/>
      <text x="0" y="68" font-weight="700">Thin black plus</text>
      <text x="0" y="88" font-size="13" fill="#374151">on the fill handle</text>
      <text x="0" y="106" font-size="13" fill="#374151">→ AutoFill / copy</text>
    </g>
  </g>
  <text x="310" y="214" font-size="13" fill="#6b7280" text-anchor="middle">The pointer's shape tells you what a click-and-drag will do.</text><text x="310" y="234" font-size="13" fill="#6b7280" text-anchor="middle">(The lecture notes call the move pointer a "double-headed arrow".)</text>
</svg>
