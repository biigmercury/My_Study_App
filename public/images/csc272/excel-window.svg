    <line x1="122" y1="148" x2="122" y2="398"/><line x1="202" y1="148" x2="202" y2="398"/><line x1="282" y1="148" x2="282" y2="398"/><line x1="362" y1="148" x2="362" y2="398"/><line x1="442" y1="148" x2="442" y2="398"/><line x1="522" y1="148" x2="522" y2="398"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="46" y="162">Item</text><text x="126" y="162">Price</text><text x="206" y="162">Double</text>
    <text x="46" y="182">Pen</text><text x="196" y="182" text-anchor="end">150</text><text x="278" y="182" text-anchor="end">300</text>
    <text x="46" y="202">Book</text><text x="196" y="202" text-anchor="end">900</text><text x="278" y="202" text-anchor="end">1800</text>
