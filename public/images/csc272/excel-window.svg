    <circle cx="150" cy="410" r="9" fill="#b45309"/><text x="150" y="414">11</text>
    <circle cx="80" cy="436" r="9" fill="#b45309"/><text x="80" y="440">12</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#111">
    <text x="10" y="482"><tspan font-weight="700" fill="#b45309">1</tspan>  Active cell (C3)</text>
    <text x="10" y="506"><tspan font-weight="700" fill="#b45309">2</tspan>  Column (B) — letters A … XFD</text>
    <text x="10" y="530"><tspan font-weight="700" fill="#b45309">3</tspan>  Row (7) — numbers 1 … 1,048,576</text>
    <text x="10" y="554"><tspan font-weight="700" fill="#b45309">4</tspan>  Fill handle</text>
    <text x="10" y="578"><tspan font-weight="700" fill="#b45309">5</tspan>  Name Box ("address bar")</text>
    <text x="10" y="602"><tspan font-weight="700" fill="#b45309">6</tspan>  Formula bar</text>
    <text x="320" y="482"><tspan font-weight="700" fill="#b45309">7</tspan>  Title bar (Book1 - Excel)</text>
    <text x="320" y="506"><tspan font-weight="700" fill="#b45309">8</tspan>  FILE tab (the File menu)</text>
    <text x="320" y="530"><tspan font-weight="700" fill="#b45309">9</tspan>  Quick Access Toolbar</text>
    <text x="320" y="554"><tspan font-weight="700" fill="#b45309">10</tspan>  Ribbon tabs</text>
    <text x="320" y="578"><tspan font-weight="700" fill="#b45309">11</tspan>  Worksheet tabs, ⊕ New sheet</text>
    <text x="320" y="602"><tspan font-weight="700" fill="#b45309">12</tspan>  Status bar (mode, sum, zoom)</text>
