  <rect x="56" y="398" width="54" height="20" fill="#ffffff"/><text x="83" y="412" font-size="10.5" fill="#217346" font-weight="700" text-anchor="middle">Sheet1</text>
  <text x="122" y="413" font-size="13" fill="#555">⊕</text>
