  </g>
  <g stroke="#dcdcdc"><line x1="75" y1="60" x2="75" y2="102"/><line x1="185" y1="60" x2="185" y2="102"/><line x1="270" y1="60" x2="270" y2="102"/><line x1="360" y1="60" x2="360" y2="102"/><line x1="460" y1="60" x2="460" y2="102"/><line x1="530" y1="60" x2="530" y2="102"/></g>
