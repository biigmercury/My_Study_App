    <circle cx="470" cy="278" r="9" fill="#b45309"/><text x="470" y="282">3</text>
    <circle cx="296" cy="222" r="9" fill="#b45309"/><text x="296" y="226">4</text>
    <circle cx="62" cy="118" r="9" fill="#b45309"/><text x="62" y="122">5</text>
    <circle cx="300" cy="118" r="9" fill="#b45309"/><text x="300" y="122">6</text>
    <circle cx="230" cy="23" r="9" fill="#b45309"/><text x="230" y="27">7</text>
