  <rect x="16" y="110" width="70" height="16" fill="#fff" stroke="#c6c6c6"/><text x="22" y="122" font-size="10.5" fill="#222">C3</text>
  <text x="100" y="122" font-size="10.5" fill="#999">✕  ✓</text><text x="136" y="122" font-size="11" font-style="italic" fill="#555">fx</text>
  <rect x="152" y="110" width="452" height="16" fill="#fff" stroke="#c6c6c6"/><text x="158" y="122" font-size="10.5" fill="#222">=B3*2</text>
