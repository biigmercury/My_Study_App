<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 650" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="620" height="650" fill="#ffffff"/>
  <rect x="10" y="10" width="600" height="440" fill="#ffffff" stroke="#9ca3af"/>
  <!-- title bar -->
  <rect x="10" y="10" width="600" height="26" fill="#217346"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.3">
